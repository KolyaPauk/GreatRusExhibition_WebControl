<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>UE5 Remote Admin Panel</title>
  <style>
    body{font-family:Arial;margin:20px}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #ccc;padding:8px;text-align:center}
    input{width:120px;padding:4px;text-align:center}
    .btn{padding:6px 10px;margin:4px;cursor:pointer}
    .ok{background:#c8f7c5} .err{background:#f7c5c5}

    .dot{
      display:inline-block;
      width:12px;
      height:12px;
      border-radius:50%;
      margin-left:6px;
    }
	.unknown{background:transparent}
    .online{background:#3cb371}
    .offline{background:#d9534f}

    .button-cell{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }

    .status-text{
      font-size:12px;
      min-height:16px;
    }
  </style>
</head>
<body>

<h3>Remote Control Admin</h3>

<table id="grid">
  <thead>
    <tr id="headerRow">
      <th>Все</th>
    </tr>
  </thead>

  <tbody>
    <tr id="ipRow">
      <td>IP</td>
    </tr>

    <tr id="buttonRow">
      <td></td>
    </tr>
  </tbody>
</table>

<script src="script.js"></script>

</body>
</html>
